<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05070c">
<title>Mannschaftskasse · SV/BSC Mörlenbach</title>
<link rel="icon" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlowc-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'InterV';src:url('fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'BarlowC';src:url('fonts/barlowc-800.woff2') format('woff2');font-weight:800;font-display:swap;}
@font-face{font-family:'BarlowC';src:url('fonts/barlowc-700.woff2') format('woff2');font-weight:700;font-display:swap;}
:root{color-scheme:dark;--bg:#05070c;--s1:#0d1119;--s2:#121826;--s3:#182033;--ink:#eef2f8;--ink2:#a2acbf;--ink3:#687288;--line:rgba(148,163,196,.13);
  --brand:#2f6bff;--brand2:#5b9bff;--ok:#22c55e;--mid:#f59e0b;--bad:#f05252;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;
  --font:'InterV',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--disp:'BarlowC','InterV',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:var(--font);color:var(--ink);font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 480px at 10% -10%,rgba(251,191,36,.13),transparent 60%),radial-gradient(700px 420px at 110% 0%,rgba(47,107,255,.2),transparent 60%),var(--bg);background-attachment:fixed;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));}
button,a{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:560px;margin:0 auto;}
header{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 16px;}
header img{width:auto;height:40px;filter:drop-shadow(0 6px 18px rgba(47,107,255,.45));}
header h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1;}
header p{color:var(--ink2);font-size:13px;margin-top:3px;}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 32px -12px rgba(0,0,0,.6);position:relative;overflow:hidden;
  opacity:0;transform:translateY(10px);animation:in .5s cubic-bezier(.2,.7,.2,1) forwards;}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(6){animation-delay:.3s}
@keyframes in{to{opacity:1;transform:none;}}
.card h2{font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em;line-height:1.1;}
.sub{color:var(--ink2);font-size:13px;line-height:1.45;margin-top:4px;}
.pill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:rgba(251,191,36,.14);color:#fde68a;}
/* Kassenstand */
.hero{text-align:center;padding:24px 18px 18px;border-color:rgba(251,191,36,.28);background:radial-gradient(420px 200px at 50% -20%,rgba(251,191,36,.22),transparent 70%),linear-gradient(180deg,var(--s2),var(--s1));}
.hero .big{font-family:var(--disp);font-weight:800;font-size:clamp(48px,15vw,68px);line-height:1;margin:12px 0 6px;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff7d6,#fbbf24 70%,#d97706);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;}
.hero .big.neg{background:linear-gradient(180deg,#ffd4d4,#f05252);-webkit-background-clip:text;background-clip:text;}
.hero small{color:var(--ink2);font-size:12.5px;display:block;}
.coins{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.coins i{position:absolute;top:-24px;font-style:normal;font-size:18px;opacity:0;animation:fall 2.4s ease-in forwards;}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0);}15%{opacity:.9;}100%{opacity:0;transform:translateY(260px) rotate(300deg);}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;}
.kpi{background:rgba(5,7,12,.35);border:1px solid var(--line);border-radius:14px;padding:10px 6px;min-width:0;}
.kpi b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi span{display:block;font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
.ok{color:#86efac;} .mid{color:#fde68a;} .bad{color:#fca5a5;}
/* Umschalter */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(148,163,196,.07);border:1px solid var(--line);margin:14px 0 4px;}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);}
.seg button.on{background:linear-gradient(180deg,#fbbf24,#d97706);color:#1a1204;box-shadow:0 6px 16px -6px rgba(251,191,36,.6);}
/* Podest */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:18px;}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;}
.pod .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:20px;color:#1a1204;margin-bottom:6px;position:relative;}
.pod .av em{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:20px;}
.pod.p1 .av{width:66px;height:66px;font-size:24px;background:linear-gradient(135deg,#fff3b0,#fbbf24 55%,#b7791f);box-shadow:0 0 0 3px rgba(251,191,36,.25),0 10px 30px -8px rgba(251,191,36,.7);}
.pod.p2 .av{background:linear-gradient(135deg,#f8fafc,#cbd5e1 55%,#8b98ad);}
.pod.p3 .av{background:linear-gradient(135deg,#fde2c0,#d97706 60%,#92400e);}
.pod .nm{font-weight:800;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pod .tt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin-top:1px;}
.pod .sm{font-family:var(--disp);font-weight:800;font-size:19px;margin-top:3px;}
.pod .ct{font-size:11.5px;color:var(--ink3);}
.pod .blk{width:100%;margin-top:8px;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:26px;color:rgba(255,255,255,.85);
  background:linear-gradient(180deg,rgba(148,163,196,.18),rgba(148,163,196,.04));border:1px solid var(--line);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;}
.pod.p1 .blk{height:92px;background:linear-gradient(180deg,rgba(251,191,36,.35),rgba(251,191,36,.05));border-color:rgba(251,191,36,.35);animation-delay:.25s;}
.pod.p2 .blk{height:66px;animation-delay:.1s;} .pod.p3 .blk{height:48px;animation-delay:.4s;}
@keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.pod.leer .av{background:var(--s3);color:var(--ink3);box-shadow:none;} .pod.leer .nm{color:var(--ink3);font-weight:600;}
/* Listen */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;}
.row:first-child{border-top:0;}
.row .rk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--s3);flex:none;}
.row .tx{flex:1;min-width:0;} .row .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .row .tx small{display:block;color:var(--ink3);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row em{font-style:normal;font-weight:800;white-space:nowrap;}
.list{margin-top:10px;}
.deckel{border-color:rgba(240,82,82,.28);background:radial-gradient(380px 160px at 100% 0%,rgba(240,82,82,.14),transparent 70%),linear-gradient(180deg,var(--s2),var(--s1));}
.tunnel{border-color:rgba(34,197,94,.25);} .tunnel .row .rk{background:rgba(34,197,94,.12);font-size:16px;}
.deckel .row .rk{background:rgba(240,82,82,.14);color:#fca5a5;}
.deckel .row:first-child .rk{background:linear-gradient(180deg,#f05252,#b91c1c);color:#fff;}
.tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:rgba(240,82,82,.12);color:#fca5a5;margin-right:6px;vertical-align:1px;}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px;border-radius:14px;font-weight:800;font-size:14.5px;
  background:linear-gradient(180deg,#3b78ff,#2459e6);color:#fff;box-shadow:0 8px 22px -8px rgba(47,107,255,.8);}
.klass{display:flex;align-items:center;gap:14px;margin-top:12px;}
.klass .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:rgba(91,155,255,.14);flex:none;}
.klass b{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.1;display:block;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;}
.st{background:var(--s3);border:1px solid var(--line);border-radius:14px;padding:10px 8px;min-width:0;text-align:center;}
.st b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st span{display:block;font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.pos{color:#86efac;} .neg{color:#fca5a5;}
.empty{text-align:center;color:var(--ink2);padding:22px 8px 6px;font-size:14px;}
.empty .e{font-size:34px;display:block;margin-bottom:6px;}
.lock{text-align:center;padding:34px 20px;}
.lock .e{font-size:44px;display:block;margin-bottom:10px;}
.skel{height:150px;border-radius:22px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px;}
@keyframes sk{to{background-position:-200% 0;}}
footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:18px;line-height:1.5;}
@media (prefers-reduced-motion:reduce){.card,.pod .blk,.coins i{animation:none!important;opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.png" alt=""><div><h1>Mannschaftskasse</h1><p>SV/BSC Mörlenbach · alles transparent</p></div></header>
  <div id="app"><div class="skel"></div><div class="skel"></div></div>
  <footer>Nur für die Mannschaft. Bitte nicht außerhalb der Gruppe teilen.<br>Zählt nur, was der Kassenwart bestätigt hat.</footer>
</div>
<script>window.MK_CFG={"url": "https://lvaukuzgcwgqipxwzabo.supabase.co", "anon": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2YXVrdXpnY3dncWlweHd6YWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTYwMTcsImV4cCI6MjEwNTczMjAxN30.jYZF8q8-SyCaWykM0wwcK58EzfTbO2VASKz1NIv1xbo", "build": "beta-0.12", "kabine": "https://svbsc.albertklee.de/"};</script>
<script>
(function(){
  'use strict';
  const C=window.MK_CFG||{}, app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ls={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },del(k){ try{ localStorage.removeItem(k); }catch(e){} }};
  const eur=(v,d)=>(+v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:d===0?0:2,maximumFractionDigits:d===0?0:2});
  const eurK=v=>Math.abs(+v||0)>=1000||Number.isInteger(+v)?eur(v,0):eur(v);
  const dt=s=>{ try{ return new Date(String(s).length===10?s+'T12:00:00':s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}); }catch(e){ return ''; } };
  const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const vn=n=>{ const w=String(n||'').trim().split(/\s+/); return w.length>1?w[0]+' '+w[w.length-1][0]+'.':w[0]; };
  // Link aus der Gruppe: …/#k=<code> oder …/<code>; danach aus der Adresszeile nehmen (Screenshots verraten ihn nicht)
  const hp=new URLSearchParams(location.hash.slice(1)), seg=(location.pathname.split('/').pop()||'');
  const pk=/^[A-Za-z0-9]{24,40}$/.test(seg)?seg:'';
  let KEY=hp.get('k')||pk||ls.get('mk_k')||'';
  if(hp.get('k')||pk){ ls.set('mk_k',KEY); try{ history.replaceState(null,'',location.pathname.replace(/[^/]*$/,'')); }catch(e){} }
  let D=null, mode=ls.get('mk_mode')||'saison', first=true;

  async function load(){
    if(!KEY){ return lock('Öffne den Kassen-Link aus der Mannschaftsgruppe, dann siehst du hier Kassenstand und Rangliste.'); }
    try{
      const r=await fetch(C.url+'/rest/v1/rpc/kasse_uebersicht',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anon,Authorization:'Bearer '+C.anon},body:JSON.stringify({p_key:KEY})});
      const j=await r.json().catch(()=>null);
      if(!r.ok){ if(r.status===401||r.status===403||/ungültig|erneuert/.test((j&&j.message)||'')){ ls.del('mk_k'); return lock('Der Link ist nicht mehr gültig. Bitte den aktuellen Link aus der Mannschaftsgruppe öffnen.'); } throw new Error((j&&j.message)||('Fehler '+r.status)); }
      D=j; render();
    }catch(e){ if(!D)app.innerHTML=`<div class="card lock"><span class="e">📡</span><h2>Gerade kein Empfang</h2><p class="sub">${esc(e.message)}</p><button class="cta" id="rl">Nochmal versuchen</button></div>`; const b=document.getElementById('rl'); if(b)b.onclick=load; }
  }
  function lock(t){ app.innerHTML=`<div class="card lock"><span class="e">🔒</span><h2>Nur für die Mannschaft</h2><p class="sub">${esc(t)}</p></div>`; }

  const TITEL=['Hauptsponsor','Premium-Partner','Trikotsponsor'], MED=['🥇','🥈','🥉'];
  const DECKEL=['Kreditrahmen ausgereizt','Lässt anschreiben','Kleiner Deckel'];
  function podium(L){
    const cell=(x,i)=>x?`<div class="pod p${i+1}"><div class="av">${esc(ini(x.name))}<em>${MED[i]}</em></div><div class="nm">${esc(vn(x.name))}</div><div class="tt">${TITEL[i]}</div><div class="sm">${eurK(x.summe)}</div><div class="ct">${x.n} Strafe${x.n===1?'':'n'}</div><div class="blk">${i+1}</div></div>`
      :`<div class="pod p${i+1} leer"><div class="av">?</div><div class="nm">noch frei</div><div class="tt">${TITEL[i]}</div><div class="sm">&nbsp;</div><div class="ct">&nbsp;</div><div class="blk">${i+1}</div></div>`;
    return `<div class="podium">${cell(L[1],1)}${cell(L[0],0)}${cell(L[2],2)}</div>`;
  }
  function render(){
    const s=D.saison||{}, sy=+String(D.saison_start||'').slice(2,4), sl=isNaN(sy)?'Saison':`Saison ${sy}/${String(sy+1).padStart(2,'0')}`;
    const top=mode==='ewig'?(D.top_ewig||[]):(D.top_saison||[]), dk=D.deckel||[];
    const pay=C.kabine?C.kabine.replace(/\/?$/,'/')+'#k='+encodeURIComponent(KEY)+'&v=kasse':'';
    app.innerHTML=`
      <div class="card hero"><div class="coins" id="coins"></div><span class="pill">💰 In der Kasse</span>
        <div class="big${+D.stand<0?' neg':''}" id="stand">${eur(first?0:D.stand)}</div>
        <small>Bank, PayPal &amp; bar zusammen${D.kassenwart?' · Kassenwart: '+esc(D.kassenwart):''}${D.stand_at?' · Stand '+dt(D.stand_at):''}</small>
        <div class="kpis"><div class="kpi"><b class="${+D.offen?'mid':'ok'}">${eurK(D.offen)}</b><span>noch offen</span></div>
          <div class="kpi"><b>${eurK(D.gemeldet)}</b><span>wartet auf OK</span></div>
          <div class="kpi"><b class="ok">${eurK(s.eingezahlt)}</b><span>eingezahlt ${esc(sl.replace('Saison ',''))}</span></div></div></div>

      <div class="card"><span class="pill">🏆 Rangliste</span><h2 style="margin-top:10px">Top-Supporter</h2>
        <p class="sub">Die treuesten Kassenfüller. Ohne euch keine Mannschaftsfahrt, danke für euren Einsatz 😄</p>
        <div class="seg"><button data-m="saison" class="${mode==='saison'?'on':''}">${esc(sl)}</button><button data-m="ewig" class="${mode==='ewig'?'on':''}">Ewige Tabelle</button></div>
        ${top.length?podium(top):`<div class="empty"><span class="e">🪙</span>${mode==='saison'?'Diese Saison hat noch keiner eine Strafe bezahlt. Das Podest wartet!':'Noch keine bezahlten Strafen.'}</div>`}
        ${s.supporter&&mode==='saison'?`<p class="sub" style="text-align:center;margin-top:12px">${s.supporter} Spieler haben diese Saison schon eingezahlt.</p>`:''}</div>

      <div class="card deckel"><span class="pill" style="background:rgba(240,82,82,.14);color:#fca5a5">🧾 Offener Deckel</span><h2 style="margin-top:10px">Hier wartet die Kasse noch</h2>
        <p class="sub">Die höchsten offenen Strafen gerade. Zahltag naht 😉</p>
        ${dk.length?`<div class="list">${dk.map((x,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="tx"><b>${esc(x.name)}</b><small><span class="tag">${DECKEL[i]}</span>${x.n} offene${x.n===1?'r':''} Posten · seit ${dt(x.seit)}</small></span><em class="bad">${eur(x.summe)}</em></div>`).join('')}</div>
          ${D.deckel_n>3?`<p class="sub" style="margin-top:6px">+ ${D.deckel_n-3} weitere mit offenem Deckel</p>`:''}
          ${pay?`<a class="cta" href="${esc(pay)}">Eigene Strafen ansehen &amp; bezahlen →</a>`:''}`
        :`<div class="empty"><span class="e">🎉</span>Alle Deckel bezahlt. Vorbildlich!</div>`}</div>

      ${(D.tunnel||[]).length?`<div class="card tunnel"><span class="pill" style="background:rgba(34,197,94,.14);color:#86efac">🥜 Im Eck</span><h2 style="margin-top:10px">Tunnelkönige</h2>
        <p class="sub">${esc(sl)}: Wer im Eck am häufigsten getunnelt wurde.</p>
        <div class="list">${D.tunnel.map((x,i)=>`<div class="row"><span class="rk">${['👑','🥈','🥉'][i]}</span><span class="tx"><b>${esc(x.name)}</b><small>${['Tunnelkönig','Tunnelprinz','Tunnel-Azubi'][i]}</small></span><em>${x.n}× 🥜</em></div>`).join('')}</div></div>`:''}

      <div class="card"><span class="pill" style="background:rgba(91,155,255,.15);color:#9cc3ff">📊 ${esc(sl)}</span>
        ${D.klassiker?`<div class="klass"><span class="ic">🔁</span><div><small class="sub" style="margin:0">Klassiker der Saison</small><b>${esc(D.klassiker.titel)}</b><small class="sub" style="margin:0">${D.klassiker.n}× verhängt · ${eurK(D.klassiker.summe)}</small></div></div>`:''}
        <div class="grid3"><div class="st"><b>${s.strafen_n||0}</b><span>Strafen</span></div><div class="st"><b>${eurK(s.strafen_summe)}</b><span>Strafen gesamt</span></div><div class="st"><b class="${+s.ausgegeben?'neg':''}">${eurK(s.ausgegeben)}</b><span>ausgegeben</span></div></div></div>

      ${(D.ausgaben||[]).length?`<div class="card"><h2>💸 Wofür das Geld ging</h2><div class="list">${D.ausgaben.map(a=>`<div class="row"><span class="tx"><b>${esc(a.titel)}</b><small>${dt(a.am)}</small></span><em class="neg">− ${eur(a.betrag)}</em></div>`).join('')}</div></div>`:''}

      ${(D.zuletzt||[]).length?`<div class="card"><h2>✅ Zuletzt eingezahlt</h2><div class="list">${D.zuletzt.map(z=>`<div class="row"><span class="rk">${esc(ini(z.name))}</span><span class="tx"><b>${esc(z.name)}</b><small>${esc(z.titel)} · ${dt(z.am)}</small></span><em class="pos">+ ${eur(z.betrag)}</em></div>`).join('')}</div></div>`:''}`;
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; ls.set('mk_mode',mode); first=false; render(); });
    if(first){ first=false; countUp(); }
  }
  function countUp(){
    const el=document.getElementById('stand'), to=+D.stand||0;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches||navigator.webdriver){ el.textContent=eur(to); return; }
    const t0=performance.now(), dur=1300;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=eur(to*e); if(p<1)requestAnimationFrame(step); };
    requestAnimationFrame(step);
    const c=document.getElementById('coins'); if(c&&to>0)for(let i=0;i<14;i++){ const x=document.createElement('i'); x.textContent=i%3?'🪙':'💶'; x.style.left=(5+Math.random()*90)+'%'; x.style.animationDelay=(Math.random()*0.9)+'s'; c.appendChild(x); }
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&D)load(); });
  window.addEventListener('hashchange',()=>location.reload());
  load();
})();
</script>
</body>
